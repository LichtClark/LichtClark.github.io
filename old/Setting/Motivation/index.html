        <div class="card-h"><span>▶️ Motivation</span><span class="link-tag">YouTube</span></div>
        <div class="card-body">
            <div id="player" class="media-frame" style="background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding-top:0;min-height:220px">
                <button class="btn btn-primary" id="loadVideo">▶ Video laden</button>

               diese Seite keine Verbindung zu Google her.</p>

<script src="../../assets/site.js?v=20260824a"></script>
<script>
/* Klick-zum-Laden: kein Kontakt zu YouTube, solange nicht gestartet wird. */
document.getElementById('loadVideo').addEventListener('click', function () {
    var box = document.getElementById('player');
    box.style.cssText = '';
    box.className = 'media-frame';
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/4q83cUGDxEI?autoplay=1&rel=0&iv_load_policy=3';
    f.title = 'Motivationsvideo';
    f.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture';
    f.allowFullscreen = true;
    box.appendChild(f);
});
</script>
